name: Full v0.0.6 fresh check

on:
  push:
    branches:
      - agent/integrate-v006-chat-baseline
  workflow_dispatch:

concurrency:
  group: full-v006-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Probe Yaw45 Pitch145 Roll145 initial posture
        run: python scripts/run_yaw45_pitch145_roll145.py --probe-init-only --stack-dump-interval-s 0
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-v006-fresh-result
          path: full_v006_fresh_result.json
          if-no-files-found: ignore
